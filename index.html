<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The page loads no scripts, styles, images, or forms, so the policy denies everything. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'">
    <!-- A zero-second refresh is an immediate redirect, which WCAG allows. GitHub Pages cannot send HTTP redirects. -->
    <meta http-equiv="refresh" content="0; url=https://github.com/gabrielmongefranco">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://github.com/gabrielmongefranco">
    <title>Redirecting to Gabriel Mongefranco on GitHub</title>
</head>
<body>
<main>
    <h1>Gabriel Mongefranco's Open Source Portfolio</h1>
    <!-- Fallback for browsers or settings that block automatic redirects. -->
    <p>This page is moving you to Gabriel Mongefranco's GitHub profile. If nothing happens, <a href="https://github.com/gabrielmongefranco">go to Gabriel Mongefranco on GitHub</a>.</p>
</main>
</body>
</html>
